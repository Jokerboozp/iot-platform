apiVersion: v1
kind: Namespace
metadata: {name: iot-platform}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: iot-platform, namespace: iot-platform}
data:
  IOT_HTTP_ADDR: ":8080"
  IOT_DEV_MODE: "false"
  IOT_OFFLINE_SCAN_INTERVAL: "30s"
  IOT_KAFKA_BROKERS: "redpanda.iot-infra.svc:9092"
  IOT_MQTT_BROKER: "ssl://emqx.iot-infra.svc:8883"
  IOT_MINIO_ENDPOINT: "minio.iot-infra.svc:9000"
  IOT_MINIO_USE_TLS: "true"
  IOT_REDIS_ADDR: "redis.iot-infra.svc:6379"
  IOT_CLICKHOUSE_URL: "http://clickhouse.iot-infra.svc:8123"
---
apiVersion: v1
kind: Secret
metadata: {name: iot-platform, namespace: iot-platform}
type: Opaque
stringData:
  IOT_POSTGRES_DSN: "REPLACE_ME"
  IOT_JWT_SECRET: "REPLACE_ME"
  IOT_ADMIN_PASSWORD: "REPLACE_ME"
  IOT_REDIS_PASSWORD: "REPLACE_ME"
  IOT_MINIO_ACCESS_KEY: "REPLACE_ME"
  IOT_MINIO_SECRET_KEY: "REPLACE_ME"
  IOT_MQTT_USERNAME: "REPLACE_ME"
  IOT_MQTT_PASSWORD: "REPLACE_ME"
  IOT_VIDEO_PLATFORM_SECRETS: "REPLACE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: iot-platform, namespace: iot-platform}
spec:
  replicas: 3
  selector: {matchLabels: {app: iot-platform}}
  template:
    metadata: {labels: {app: iot-platform}}
    spec:
      serviceAccountName: iot-platform
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: platform
          image: your-registry/iot-platform:1.0.0
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: iot-platform}}, {secretRef: {name: iot-platform}}]
          resources: {requests: {cpu: "500m", memory: "512Mi"}, limits: {cpu: "2", memory: "2Gi"}}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: http}, initialDelaySeconds: 20, periodSeconds: 15}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}, {name: data, mountPath: /app/data}]
      volumes: [{name: tmp, emptyDir: {}}, {name: data, emptyDir: {}}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: iot-platform, namespace: iot-platform}
---
apiVersion: v1
kind: Service
metadata: {name: iot-platform, namespace: iot-platform}
spec: {selector: {app: iot-platform}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: iot-platform, namespace: iot-platform}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: iot-platform}
  minReplicas: 3
  maxReplicas: 12
  behavior: {scaleDown: {stabilizationWindowSeconds: 300}}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: iot-platform, namespace: iot-platform}
spec:
  podSelector: {matchLabels: {app: iot-platform}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}]
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: iot-infra}}}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
