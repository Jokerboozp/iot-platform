# Protocol-only DeepSeek Harness composition for the IoT operations gateway.
# stdout is reserved for newline-delimited JSON-RPC and no stdout logger is
# composed. The gateway provides all dynamic values through a scrubbed child
# environment for one tenant/user-namespaced resident runtime.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    thinking: enabled
    reasoningEffort: high
    streamIdleTimeoutMs: 300000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.IOT_OPS_PERSONA
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false
    maxParallelToolCalls: 3
    tools:
      mode: native

- id: mcp-iot
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: iot
    transport: streamable-http
    url: !!js process.env.IOT_MCP_URL
    headers:
      X-IOT-Runtime-Key: !!js process.env.IOT_MCP_RUNTIME_KEY
    toolCallTimeoutMs: 60000
    failOnStartupError: true
    reconnect:
      enabled: true
      initialDelayMs: 500
      maxDelayMs: 30000
      maxAttempts: 10

- id: session-persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.IOT_HARNESS_SESSION_ROOT
    packChunks: true
    compression: none

- id: iot-ops-policy
  name: './iot-ops-plugin.mjs'
  config:
    allowedTools: !!js JSON.parse(process.env.IOT_ALLOWED_TOOLS_JSON ?? '[]')
