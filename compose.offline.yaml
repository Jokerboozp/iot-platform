name: iot-platform

# 离线部署覆盖层：固定运行镜像标签，并为 ThingsPanel 的 build-only 服务补充 image。
# 部署脚本仍会强制使用 --no-build --pull never。
services:
  platform-api:
    image: ${IOT_PLATFORM_API_IMAGE:-iot-platform-api:offline}

  platform-web:
    image: ${IOT_PLATFORM_WEB_IMAGE:-iot-platform-web:offline}

  gb26875-gateway:
    image: ${IOT_PLATFORM_API_IMAGE:-iot-platform-api:offline}

  deepseek-harness:
    image: ${IOT_DEEPSEEK_HARNESS_IMAGE:-iot-deepseek-harness:offline}

  backup-service:
    image: ${IOT_BACKUP_IMAGE:-iot-platform-backup:offline}

  backend:
    image: ${IOT_THINGSPANEL_BACKEND_IMAGE:-iot-thingspanel-backend:offline}

  thingspanel:
    image: ${IOT_THINGSPANEL_WEB_IMAGE:-iot-thingspanel-web:offline}
