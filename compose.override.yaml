# VS Code 本地调试覆盖层。
# 从宿主机启动 Go 服务时，使用这些端口访问 Docker 内的依赖服务。
services:
  postgres:
    ports:
      - "127.0.0.1:15432:5432"

  redis:
    ports:
      - "127.0.0.1:16379:6379"

  minio:
    ports:
      - "127.0.0.1:19000:9000"

  minio-dr:
    ports:
      - "127.0.0.1:19001:9000"

  clickhouse:
    ports:
      - "127.0.0.1:18123:8123"

  ollama:
    ports:
      - "127.0.0.1:11434:11434"

  weaviate:
    ports:
      - "127.0.0.1:18080:8080"

  deepseek-harness:
    environment:
      # Harness 容器回调宿主机上的本地 API MCP 端点。
      IOT_HARNESS_MCP_ALLOWED_ORIGINS: http://host.docker.internal:8081
